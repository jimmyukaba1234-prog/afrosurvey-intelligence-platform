dataset: survey_responses_bronze
version: "1.0.0"
description: "Raw survey response schema for Bronze ingestion"

primary_key:
  - response_id

fields:
  response_id:
    type: string
    required: true

  respondent_id:
    type: string
    required: true

  survey_id:
    type: string
    required: true

  country:
    type: string
    required: true

  region:
    type: string
    required: false

  gender:
    type: string
    required: true

  age:
    type: integer
    required: false

  education_level:
    type: string
    required: false

  employment_status:
    type: string
    required: false

  completion_status:
    type: string
    required: true

  submission_timestamp:
    type: timestamp
    required: true

  source_system:
    type: string
    required: true

  q1_democracy:
    type: integer
    required: false

  q2_economy:
    type: string
    required: false

  q3_trust_govt:
    type: integer
    required: false

  q4_corruption:
    type: string
    required: false

  q5_election_fairness:
    type: integer
    required: false