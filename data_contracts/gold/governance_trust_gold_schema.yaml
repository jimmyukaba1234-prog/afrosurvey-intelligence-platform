dataset: governance_trust_gold
version: "1.0.0"
description: "Government trust analysis based on survey response scores"

fields:
  country:
    type: string
    required: true

  region:
    type: string
    required: false

  total_responses:
    type: long
    required: true

  average_trust_score:
    type: double
    required: false

  low_trust_count:
    type: long
    required: true

  medium_trust_count:
    type: long
    required: true

  high_trust_count:
    type: long
    required: true

  trust_index:
    type: double
    required: false

  gold_processed_at:
    type: timestamp
    required: true

  source_layer:
    type: string
    required: true

  target_layer:
    type: string
    required: true