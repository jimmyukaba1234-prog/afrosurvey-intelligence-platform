dataset: survey_responses_silver
version: "1.0.0"
description: "Cleaned and standardized survey response schema"

primary_key:
  - response_id

fields:
  response_id:
    type: string
    required: true

  respondent_id:
    type: string
    required: true

  survey_id:
    type: string
    required: true

  country:
    type: string
    required: true

  country_code:
    type: string
    required: false

  region:
    type: string
    required: false

  gender:
    type: string
    required: true

  age:
    type: integer
    required: false

  age_group:
    type: string
    required: false

  education_level:
    type: string
    required: false

  employment_status:
    type: string
    required: false

  completion_status:
    type: string
    required: true

  submission_date:
    type: date
    required: true

  submission_timestamp:
    type: timestamp
    required: true

  ingestion_timestamp:
    type: timestamp
    required: true

  duplicate_flag:
    type: boolean
    required: true

  validation_status:
    type: string
    required: true

  source_system:
    type: string
    required: true