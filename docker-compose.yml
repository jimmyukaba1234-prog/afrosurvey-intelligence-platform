services:

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: afrosurvey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  
  # MinIO Data Lake
  minio:
    image: minio/minio
    container_name: afrosurvey-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  
  # Airflow Initialization
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: afrosurvey-airflow-init
    env_file:
    - .env
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW_UID: ${AIRFLOW_UID}
    user: "${AIRFLOW_UID}:0"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./scripts:/opt/airflow/scripts
      - ./ingestion:/opt/airflow/ingestion
      - ./utils:/opt/airflow/utils
      - ./config:/opt/airflow/config
      - ./data:/opt/airflow/data
      - ./data_contracts:/opt/airflow/data_contracts
      
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && \
        airflow users create \
          --username ${AIRFLOW_ADMIN_USERNAME} \
          --password ${AIRFLOW_ADMIN_PASSWORD} \
          --firstname ${AIRFLOW_ADMIN_FIRSTNAME} \
          --lastname ${AIRFLOW_ADMIN_LASTNAME} \
          --role Admin \
          --email ${AIRFLOW_ADMIN_EMAIL}


  # Airflow Webserver
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    env_file:
    - .env
    container_name: afrosurvey-airflow-webserver
    restart: unless-stopped
    depends_on:
      - postgres
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW_UID: ${AIRFLOW_UID}
      
    user: "${AIRFLOW_UID}:0"
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./scripts:/opt/airflow/scripts
      - ./ingestion:/opt/airflow/ingestion
      - ./utils:/opt/airflow/utils
      - ./config:/opt/airflow/config
      - ./data:/opt/airflow/data
      - ./data_contracts:/opt/airflow/data_contracts
      - /var/run/docker.sock:/var/run/docker.sock
    #command: bash -c "pip install pandas sqlalchemy psycopg2-binary minio requests pyyaml python-dotenv faker pyreadstat && airflow webserver"
    command: airflow webserver

  # Airflow Scheduler
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: afrosurvey-airflow-scheduler
    env_file:
    - .env
    restart: unless-stopped
    depends_on:
      - postgres
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW_UID: ${AIRFLOW_UID}
    user: "${AIRFLOW_UID}:0"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./scripts:/opt/airflow/scripts
      - ./ingestion:/opt/airflow/ingestion
      - ./utils:/opt/airflow/utils
      - ./config:/opt/airflow/config
      - ./data:/opt/airflow/data
      - ./data_contracts:/opt/airflow/data_contracts
      - /var/run/docker.sock:/var/run/docker.sock
    #command: bash -c "pip install pandas sqlalchemy psycopg2-binary minio requests pyyaml python-dotenv faker pyreadstat && airflow scheduler"
    command: airflow scheduler

  spark-submit:
    image: apache/spark:3.5.1
    container_name: afrosurvey-spark-submit
    depends_on:
      - spark
      - minio
    environment:
      HOME: /tmp
      PYTHONPATH: /opt/afrosurvey
    volumes:
      - ./spark_jobs:/opt/afrosurvey/spark_jobs
      - ./utils:/opt/afrosurvey/utils
      - ./config:/opt/afrosurvey/config
      - ./data_contracts:/opt/afrosurvey/data_contracts
      - ./.env:/opt/afrosurvey/.env
    working_dir: /opt/afrosurvey
    command: >
      bash -c "pip install python-dotenv pyyaml &&
      /opt/spark/bin/spark-submit
      --master spark://spark:7077
      --conf spark.jars.ivy=/tmp/.ivy2
      --conf spark.executorEnv.PYTHONPATH=/opt/afrosurvey
      --conf spark.driverEnv.PYTHONPATH=/opt/afrosurvey
      --packages org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
      /opt/afrosurvey/spark_jobs/bronze_to_silver.py"
    profiles:
      - spark-job


  spark:
    image: apache/spark:3.5.1
    container_name: afrosurvey-spark
    restart: unless-stopped
    depends_on:
      - minio
      - postgres
    ports:
      - "7077:7077"
      - "8081:8081"
    volumes:
      - ./spark_jobs:/opt/afrosurvey/spark_jobs
      - ./utils:/opt/afrosurvey/utils
      - ./config:/opt/afrosurvey/config
      - ./data_contracts:/opt/afrosurvey/data_contracts
      - ./.env:/opt/afrosurvey/.env
    working_dir: /opt/afrosurvey
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host 0.0.0.0
      --port 7077
      --webui-port 8081

# Persistent Volumes
volumes:
  postgres_data:
  minio_data: